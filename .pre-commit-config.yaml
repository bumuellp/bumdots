---
default_language_version:
    node: 24.21.0

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json
          - id: mixed-line-ending
            args: [--fix=lf]

    - repo: https://github.com/python-jsonschema/check-jsonschema
      rev: 6a01bef7bf8c33841ae95cf934d3f3cda607b7dd # frozen: 0.31.2
      hooks:
          - id: check-github-workflows

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea # frozen: v4.0.0-alpha.8
      hooks:
          - id: prettier
            types_or: [markdown, yaml, json]

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: cea9f0116f479bbf29095962781446b326b96825 # frozen: 44.93.5
      hooks:
          - id: renovate-config-validator
            files: ^(renovate-config\.json|\.github/renovate\.json)$

    - repo: https://github.com/bumuellp/cabumtain-hook
      rev: feaf72fccae12b962b9d2d2a3971c26c9fdb34df # frozen: v1.8.0
      hooks:
          - id: commit-msg
          - id: secret-scan
          - id: yaml-xml-lint
          - id: trivy-config
